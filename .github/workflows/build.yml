name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Linux beacon binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p artifact
          version="${GITHUB_REF_NAME:-dev}"
          go build -o artifact/beacon-${version}-linux-amd64 -trimpath -ldflags='-s -w' ./cmd/beacon
          ls -la artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: beacon-linux-amd64
          path: artifact/*

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ansible-lint
      - run: ansible-lint deploy/ansible/
